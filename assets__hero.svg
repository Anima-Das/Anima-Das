<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="t d"><title id="t">Anima Das, AI Automation Engineer and Systems Architect</title><desc id="d">Animated isometric automation scene: data packets flow from intake through validation to an AI agent, pause at an amber human-approval gate, then reach email, CRM and a PostgreSQL store.</desc><defs><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
