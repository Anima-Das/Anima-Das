<text x="66" y="100" fill="#91A5C9" font-family="Inter,Arial,sans-serif" font-size="15" letter-spacing="1.8">A CONTROLLED PIPELINE · VALIDATE → DECIDE → APPROVE → EXECUTE → RECOVER</text>
