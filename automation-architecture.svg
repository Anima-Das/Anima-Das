<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="t d">
<title id="t">Anima Das — AI automation system architecture</title><desc id="d">An isometric architecture diagram showing input sources, n8n orchestration, AI reasoning, data validation, human approval, guarded actions and audit recovery.</desc>
<defs>
 <linearGradient id="bg2" x2="1" y2="1"><stop stop-color="#080D1C"/><stop offset="1" stop-color="#151630"/></linearGradient>
