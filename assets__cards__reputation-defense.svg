<svg xmlns="http://www.w3.org/2000/svg" width="480" height="322" viewBox="0 0 480 322" role="img" aria-labelledby="t d"><title id="t">AI Social-Media &amp; Brand Reputation Defense Engine</title><desc id="d">Classifies incoming social-media events and applies each tenant&#x27;s own policy to decide what the system may do.</desc><rect x=".5" y=".5" width="479" height="321" rx="16" fill="#111B38" stroke="#26345F"/><rect x="0.5" y="22" width="3.5" height="46" rx="2" fill="#FFB547"/><g><polygon points="428.0,35.2 464.4,56.0 428.0,76.8 391.6,56.0" fill="#080D1C" fill-opacity="1" stroke="#26345F" stroke-width="1" stroke-linejoin="round"/><g><polygon points="410.6,36.0 428.0,45.9 428.0,65.9 410.6,56.0" fill="#b48036" stroke="#684c25" stroke-width="0.8" stroke-linejoin="round"/><polygon points="445.4,36.0 428.0,45.9 428.0,65.9 445.4,56.0" fill="#7c5a2a" stroke="#684c25" stroke-width="0.8" stroke-linejoin="round"/><polygon points="428.0,26.1 445.4,36.0 428.0,45.9 410.6,36.0" fill="#ffc56f" stroke="#684c25" stroke-width="0.8" stroke-linejoin="round"/></g></g><text x="28" y="44" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#E8ECFF">AI Social-Media &amp; Brand Reputation</text><text x="28" y="67" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#E8ECFF">Defense Engine</text><text x="28" y="104.0" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E8ECFF">Classifies incoming social-media events and applies each</text><text x="28" y="123.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E8ECFF">tenant&#x27;s own policy to decide what the system may do.</text><text x="28" y="151.0" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A0C8"><tspan font-weight="700" fill="#FFB547">Solves </tspan>Automated reputation responses with no signature checks,</text><text x="28" y="170.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A0C8">no limits and no record of what was done.</text><text x="28" y="198.0" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A0C8"><tspan font-weight="700" fill="#FFB547">Value </tspan>Signed, replay-protected intake, a kill switch, durable</text><text x="28" y="217.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A0C8">human-review tasks and PostgreSQL audit records keep</text><text x="28" y="237.0" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A0C8">actions controlled and traceable.</text><rect x="28.0" y="281" width="38.6" height="22" rx="11" fill="#FFB547" fill-opacity=".10" stroke="#FFB547" stroke-opacity=".45"/><text x="47.3" y="296" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#E8ECFF">n8n</text><rect x="72.6" y="281" width="82.0" height="22" rx="11" fill="#FFB547" fill-opacity=".10" stroke="#FFB547" stroke-opacity=".45"/><text x="113.6" y="296" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#E8ECFF">PostgreSQL</text><rect x="160.6" y="281" width="119.2" height="22" rx="11" fill="#FFB547" fill-opacity=".10" stroke="#FFB547" stroke-opacity=".45"/><text x="220.2" y="296" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#E8ECFF">Event processing</text><rect x="285.8" y="281" width="113.0" height="22" rx="11" fill="#FFB547" fill-opacity=".10" stroke="#FFB547" stroke-opacity=".45"/><text x="342.3" y="296" text-anchor="middle" 