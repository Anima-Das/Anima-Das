<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d"><title id="t">How the workflows I build run</title><desc id="d">Six stages: intake, validate, decide, approve, act, record. A data packet moves through them in order.</desc><defs><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.lit{opacity:0;animation:lit 12s ease-in-out infinite}@keyframes lit{0%{opacity:0}4%{opacity:1}16%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){.lit{animation:none;opacity:.4}}</style><rect x=".5" y=".5" width="999" height="249" rx="16" fill="#111B38" stroke="#26345F"/><line x1="40" x2="960" y1="78" y2="78" stroke="#215469" stroke-width="7" stroke-linecap="round"/><line x1="40" x2="960" y1="78" y2="78" stroke="#4CC9F0" stroke-width="2" stroke-dasharray="3 13" stroke-linecap="round" opacity=".8"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.1s" repeatCount="indefinite"/></line><ellipse class="lit" cx="96" cy="82" rx="52" ry="28" fill="#4CC9F0" fill-opacity=".28" style="animation-delay:0.38s"/><g><g><polygon points="63.6,58.0 96.0,76.7 96.0,102.7 63.6,84.0" fill="#368eac" stroke="#215469" stroke-width="0.8" stroke-linejoin="round"/><polygon points="128.4,58.0 96.0,76.7 96.0,102.7 128.4,84.0" fill="#27647b" stroke="#215469" stroke-width="0.8" stroke-linejoin="round"/><polygon points="96.0,39.3 128.4,58.0 96.0,76.7 63.6,58.0" fill="#73d5f3" stroke="#215469" stroke-width="0.8" stroke-linejoin="round"/></g></g><text x="96" y="156" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#E8ECFF">Intake</text><text x="96" y="178" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">Webhooks, forms and</text><text x="96" y="195" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">sheets enter through one</text><text x="96" y="212" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">defined door</text><ellipse class="lit" cx="258" cy="82" rx="52" ry="28" fill="#4CC9F0" fill-opacity=".28" style="animation-delay:2.49s"/><g><g><polygon points="225.6,58.0 258.0,76.7 258.0,102.7 225.6,84.0" fill="#368eac" stroke="#215469" stroke-width="0.8" stroke-linejoin="round"/><polygon points="290.4,58.0 258.0,76.7 258.0,102.7 290.4,84.0" fill="#27647b" stroke="#215469" stroke-width="0.8" stroke-linejoin="round"/><polygon points="258.0,39.3 290.4,58.0 258.0,76.7 225.6,58.0" fill="#73d5f3" stroke="#215469" stroke-width="0.8" stroke-linejoin="round"/></g></g><text x="258" y="156" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#E8ECFF">Validate</text><text x="258" y="178" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">Schema checks,</text><text x="258" y="195" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">normalising and</text><text x="258" y="212" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">duplicate detection</text><ellipse class="lit" cx="420" cy="82" rx="52" ry="28" fill="#8B7CFF" fill-opacity=".28" style="animation-delay:4.61s"/><g><g><polygon points="387.6,58.0 420.0,76.7 420.0,102.7 387.6,84.0" fill="#6259b7" stroke="#3a356f" stroke-width="0.8" stroke-linejoin="round"/><polygon points="452.4,58.0 420.0,76.7 420.0,102.7 452.4,84.0" fill="#453f82" stroke="#3a356f" stroke-width="0.8" stroke-linejoin="round"/><polygon points="420.0,39.3 452.4,58.0 420.0,76.7 387.6,58.0" fill="#a599ff" stroke="#3a356f" stroke-width="0.8" stroke-linejoin="round"/></g></g><text x="420" y="156" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#E8ECFF">Decide</text><text x="420" y="178" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">The model returns</text><text x="420" y="195" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">validated JSON, grounded</text><text x="420" y="212" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">in evidence</text><ellipse class="lit" cx="582" cy="82" rx="52" ry="28" fill="#FFB547" fill-opacity=".28" style="animation-delay:6.72s"/><g><g><polygon points="587.8,38.4 598.6,44.7 598.6,80.7 587.8,74.4" fill="#b48036" stroke="#684c25" stroke-width="0.8" stroke-linejoin="round"/><polygon points="606.3,40.2 598.6,44.7 598.6,80.7 606.3,76.2" fill="#7c5a2a" stroke="#684c25" stroke-width="0.8" stroke-linejoin="round"/><polygon points="595.5,34.0 606.3,40.2 598.6,44.7 587.8,38.4" fill="#ffc56f" stroke="#684c25" stroke-width="0.8" stroke-linejoin="round"/></g><g><polygon points="557.7,55.8 568.5,62.0 568.5,98.0 557.7,91.8" fill="#b48036" stroke="#684c25" stroke-width="0.8" stroke-linejoin="round"/><polygon points="576.2,57.6 568.5,62.0 568.5,98.0 576.2,93.6" fill="#7c5a2a" stroke="#684c25" stroke-width="0.8" stroke-linejoin="round"/><polygon points="565.4,51.3 576.2,57.6 568.5,62.0 557.7,55.8" fill="#ffc56f" stroke="#684c25" stroke-width="0.8" stroke-linejoin="round"/></g><g><polygon points="557.7,47.8 568.5,54.0 568.5,62.0 557.7,55.8" fill="#b48036" stroke="#684c25" stroke-width="0.8" stroke-linejoin="round"/><polygon points="606.3,32.2 568.5,54.0 568.5,62.0 606.3,40.2" fill="#7c5a2a" stroke="#684c25" stroke-width="0.8" stroke-linejoin="round"/><polygon points="595.5,26.0 606.3,32.2 568.5,54.0 557.7,47.8" fill="#ffc56f" stroke="#684c25" stroke-width="0.8" stroke-linejoin="round"/></g></g><text x="582" y="156" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#E8ECFF">Approve</text><text x="582" y="178" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">A person signs off on</text><text x="582" y="195" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">anything consequential</text><ellipse class="lit" cx="744" cy="82" rx="52" ry="28" fill="#4CC9F0" fill-opacity=".28" style="animation-delay:8.83s"/><g><g><polygon points="711.6,58.0 744.0,76.7 744.0,102.7 711.6,84.0" fill="#368eac" stroke="#215469" stroke-width="0.8" stroke-linejoin="round"/><polygon points="776.4,58.0 744.0,76.7 744.0,102.7 776.4,84.0" fill="#27647b" stroke="#215469" stroke-width="0.8" stroke-linejoin="round"/><polygon points="744.0,39.3 776.4,58.0 744.0,76.7 711.6,58.0" fill="#73d5f3" stroke="#215469" stroke-width="0.8" stroke-linejoin="round"/></g></g><text x="744" y="156" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#E8ECFF">Act</text><text x="744" y="178" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">Idempotent API calls, so</text><text x="744" y="195" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">a retry never repeats an</text><text x="744" y="212" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">action</text><ellipse class="lit" cx="906" cy="82" rx="52" ry="28" fill="#6F83B8" fill-opacity=".28" style="animation-delay:10.95s"/><g><g><polygon points="873.6,58.0 906.0,76.7 906.0,102.7 873.6,84.0" fill="#4f5e85" stroke="#2f3853" stroke-width="0.8" stroke-linejoin="round"/><polygon points="938.4,58.0 906.0,76.7 906.0,102.7 938.4,84.0" fill="#374260" stroke="#2f3853" stroke-width="0.8" stroke-linejoin="round"/><polygon points="906.0,39.3 938.4,58.0 906.0,76.7 873.6,58.0" fill="#8f9ec8" stroke="#2f3853" stroke-width="0.8" stroke-linejoin="round"/></g></g><text x="906" y="156" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#E8ECFF">Record</text><text x="906" y="178" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">State, audit events and</text><text x="906" y="195" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">reconciliation of unsure</text><text x="906" y="212" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.2" fill="#93A0C8">outcomes</text><circle r="4.2" fill="#4CC9F0" filter="url(#glow)"><animateMotion dur="12s" repeatCount="indefinite" path="M40 78 L960 78"/></circle></svg>