<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380" role="img" aria-label="Girl coding from home">
  <style>
    .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:800;fill:#2a2a5c}
    .k{animation:blink 1.2s infinite}
    @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
    .hand{animation:type .5s infinite alternate}
    @keyframes type{from{transform:translateY(0)}to{transform:translateY(3px)}}
  </style>
  <text class="t" x="160" y="38" font-size="30" text-anchor="middle" transform="rotate(-3 160 38)">Coding From</text>
  <!-- hair back -->
  <path d="M95 150 C 80 100, 120 62, 160 62 C 205 62, 240 100, 225 150 C 235 190, 225 215, 215 225 L105 225 C 95 215, 85 190, 95 150Z" fill="#2b1b17"/>
  <circle cx="160" cy="58" r="20" fill="#2b1b17"/>
  <!-- neck + face -->
  <rect x="148" y="190" width="24" height="30" rx="8" fill="#f2c4a0"/>
  <ellipse cx="160" cy="148" rx="52" ry="58" fill="#f6cfae"/>
  <!-- fringe -->
  <path d="M108 138 C 112 92, 205 84, 212 138 C 190 112, 150 108, 108 138Z" fill="#2b1b17"/>
  <!-- glasses -->
  <g fill="none" stroke="#2a2a5c" stroke-width="4">
    <circle cx="138" cy="152" r="16"/><circle cx="182" cy="152" r="16"/><path d="M154 152h12"/>
  </g>
  <circle cx="138" cy="152" r="4" fill="#2a2a5c"/><circle cx="182" cy="152" r="4" fill="#2a2a5c"/>
  <path d="M146 182 Q160 194 174 182" stroke="#c4566f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="122" cy="176" r="6" fill="#f2a0a0" opacity=".5"/><circle cx="198" cy="176" r="6" fill="#f2a0a0" opacity=".5"/>
  <!-- body (sweater) -->
  <path d="M70 330 C 62 262, 95 222, 160 218 C 225 222, 258 262, 250 330Z" fill="#ff7a2f"/>
  <path d="M138 218 Q160 240 182 218" fill="#f6cfae"/>
  <!-- laptop -->
  <g>
    <rect x="62" y="262" width="196" height="68" rx="8" fill="#7d8591"/>
    <rect x="70" y="268" width="180" height="56" rx="4" fill="#1e2433"/>
    <rect x="82" y="278" width="60" height="5" rx="2" fill="#ea4b71"/>
    <rect x="90" y="289" width="90" height="5" rx="2" fill="#38bdf8"/>
    <rect x="82" y="300" width="44" height="5" rx="2" fill="#a78bfa"/>
    <rect x="134" y="300" width="64" height="5" rx="2" fill="#34d399"/>
    <rect class="k" x="204" y="300" width="6" height="8" fill="#fff"/>
    <circle cx="224" cy="296" r="13" fill="#ea4b71"/>
    <text x="224" y="301" font-size="14" font-weight="800" text-anchor="middle" fill="#fff" font-family="Arial">n8</text>
    <path d="M44 330H276" stroke="#2a2a5c" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- hands -->
  <g class="hand"><ellipse cx="106" cy="334" rx="16" ry="9" fill="#f6cfae"/><ellipse cx="214" cy="334" rx="16" ry="9" fill="#f6cfae"/></g>
  <text class="t" x="160" y="372" font-size="30" text-anchor="middle" transform="rotate(2 160 372)">Home</text>
</svg>
