name: Validate profile

on:
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - "assets__*.svg"
      - "profile-3d-contrib__*.svg"
      - "workflow__*.yml"
      - "scripts__*.py"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Check README references, SVG files and workflows
        run: python scripts__validate.py
