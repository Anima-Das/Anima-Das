transition.</text><text x="28" y="170.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A0C8"><tspan font-weight="700" fill="#8B7CFF">Solves </tspan>Automated outreach that double-sends, skips steps or</text><text x="28" y="190.0" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A0C8">acts on an outcome it is unsure about.</text><text x="28" y="217.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A0C8"><tspan font-weight="700" fill="#8B7CFF">Value </tspan>Claims are verified before drafting, layered send gates</text><text x="28" y="237.0" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A0C8">guard each email, and uncertain results are held for</text><text x="28" y="256.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A0C8">reconciliation instead of resent.</text><rect x="28.0" y="281" width="38.6" height="22" rx="11" fill="#8B7CFF" fill-opacity=".10" stroke="#8B7CFF" stroke-opacity=".45"/><text x="47.3" y="296" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#E8ECFF">n8n</text><rect x="72.6" y="281" width="82.0" height="22" rx="11" fill="#8B7CFF" fill-opacity=".10" stroke="#8B7CFF" stroke-opacity=".45"/><text x="113.6" y="296" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#E8ECFF">PostgreSQL</text><rect x="160.6" y="281" width="82.0" height="22" rx="11" fill="#8B7CFF" fill-opacity=".10" stroke="#8B7CFF" stroke-opacity=".45"/><text x="201.6" y="296" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#E8ECFF">JavaScript</text><rect x="