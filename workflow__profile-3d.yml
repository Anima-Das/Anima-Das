name: Profile 3D contributions

on:
  schedule:
    - cron: "15 18 * * *" # daily, 18:15 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-generated-files
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          # PROFILE_TOKEN is optional. Add it as a repository secret to include private contributions.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Copy generated images into the flat repository root
        run: |
          cp profile-3d-contrib/profile-night-view.svg profile-3d-contrib__profile-night-view.svg
          if [ -f profile-3d-contrib/profile-green-animate.svg ]; then
            cp profile-3d-contrib/profile-green-animate.svg profile-3d-contrib__profile-green-animate.svg
          fi

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib__profile-night-view.svg profile-3d-contrib__profile-green-animate.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh 3D contribution calendar"
            git pull --rebase
            git push
          fi
