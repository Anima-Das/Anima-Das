<svg xmlns="http://www.w3.org/2000/svg" width="480" height="322" viewBox="0 0 480 322" role="img" aria-labelledby="t d"><title id="t">AI Customer Support &amp; Voice Agent Automation</title><desc id="d">A webhook backend for voice agents. It routes FAQ, order status, booking, ticketing and human escalation through one structured JSON response.</desc><rect x=".5" y=".5" width="479" height="321" rx="16" fill="#111B38" stroke="#26345F"/><rect x="0.5" y="22" width="3.5" height="46" rx="2" fill="#4CC9F0"/><g><polygon points="428.0,35.2 464.4,56.0 428.0,76.8 391.6,56.0" fill="#080D1C" fill-opacity="1" stroke="#26345F" stroke-width="1" stroke-linejoin="round"/><g><polygon points="410.6,36.0 428.0,45.9 428.0,65.9 410.6,56.0" fill="#368eac" stroke="#215469" stroke-width="0.8" stroke-linejoin="round"/><polygon points="445.4,36.0 428.0,45.9 428.0,65.9 445.4,56.0" fill="#27647b" stroke="#215469" stroke-width="0.8" stroke-linejoin="round"/><polygon points="428.0,26.1 445.4,36.0 428.0,45.9 410.6,36.0" fill="#73d5f3" stroke="#215469" stroke-width="0.8" stroke-linejoin="round"/></g></g><text x="28" y="44" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#E8ECFF">AI Customer Support &amp; Voice Agent</text><text x="28" y="67" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#E8ECFF">Automation</text><text x="28" y="104.0" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E8ECFF">A webhook backend for voice agents. It routes FAQ, order</text><text x="28" y="123.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E8ECFF">status, booking, ticketing and human escalation through</text><text x="28" y="143.0" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E8ECFF">one structured JSON response.</text><text x="28" y="170.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A0C8"><tspan font-weight="700" fill="#4CC9F0">Solves </tspan>Voice agents that repeat actions or answer with</text><text x="28" y="190.0" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A0C8">information nobody verified.</text><text x="28" y="217.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A0C8"><tspan font-weight="700" fill="#4CC9F0">Value </tspan>HMAC-SHA256 protects order lookups, idempotency blocks</text><text x="28" y="237.0" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A0C8">duplicates, and answers not grounded in verified</text><text x="28" y="256.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A0C8">knowledge are rejected.</text><rect x="28.0" y="281" width="38.6" height="22" rx="11" fill="#4CC9F0" fill-opacity=".10" stroke="#4CC9F0" stroke-opacity=".45"/><text x="47.3" y="296" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#E8ECFF">n8n</text><rect x="72.6" y="281" width="82.0" height="22" rx="11" fill="#4CC9F0" fill-opacity=".10" stroke="#4CC9F0" stroke-opacity=".45"/><text x="113.6" y="296" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#E8ECFF">PostgreSQL</text><rect x="160.6" y="281" width="69.6" height="22" rx="11" fill="#4CC9F0" fill-opacity=".10" stroke="#4CC9F0" stroke-opacity=".45"/><text x="195.4" y="296" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#E8ECFF">Webhooks</text><rect x="236.2" y="281" width="88.2" height="22" rx="11" fill="#4CC9F0" fill-opacity=".10" stroke="#4CC9F0" stroke-opacity=".45"/><text x="280.3" y="296" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#E8ECFF">HMAC-SHA256</text></svg>